description: >-
  Macquarie University publishes no rate-limit table. The one institution-operated surface, the
  Research Portal OAI-PMH endpoint at research-management.mq.edu.au, returned no rate-limit,
  quota or Retry-After header on any probe of 2026-08-30, and no 429 was observed. What it does
  impose is a fixed page size of 100 records per response with a resumptionToken, which makes a
  full publications harvest roughly 1,141 sequential requests against a completeListSize of
  114,062 — pacing is the harvester's responsibility, not the server's.
notes: >-
  No published limit and none observed; the figures below are a courtesy posture, not a measured
  or stated policy. Earlier revisions of this file named IIIF and library rate limits — neither
  surface was found on any Macquarie host, and those claims were removed on 2026-08-30.
