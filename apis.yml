    url: https://docs.figshare.com/
- aid: macquarie:library-alma-tools
  name: Macquarie University Library Open-Source Tooling
  description: >-
    The Macquarie University Library publishes public open-source utilities on GitHub that integrate with
    the Ex Libris Alma library services platform (for example an Alma toolkit and resource-sharing partner
    harvest/sync tools). These consume the Alma APIs rather than exposing a public Macquarie API of their
    own.
  humanURL: https://github.com/mqlibrary
  tags:
  - Library
