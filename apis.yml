- aid: macquarie:research-portal-pure
  name: Macquarie University Research Portal (Elsevier Pure)
  x-operator: tenant
  description: >-
    Macquarie's research-information system is Elsevier Pure, tenanted on Macquarie hosts —
    researchers.mq.edu.au for the public portal and research-management.mq.edu.au for the
    administrative side. The Pure API at /ws/api is api-key gated and its OpenAPI description is
    publicly readable at /ws/api/openapi.json, and it is ELSEVIER'S CONTRACT, not Macquarie's:
    info.title "Pure API", info.contact pure-support@elsevier.com, version 5.33.3-3, 568 paths, and
    a relative servers url of /ws/api that hides the host from any host-based ownership check. This
    is the exact shape that put 36 Elsevier Pure specs into Manchester's repo under Manchester's
    name. The relationship is recorded; the contract is not saved here and belongs to Elsevier.
