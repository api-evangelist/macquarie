- aid: macquarie:rdr-oai-pmh
  name: Macquarie University Research Data Repository (OAI-PMH)
  description: >-
    The Figshare-backed Research Data Repository exposes metadata for harvest via the OAI-PMH protocol
    through the Figshare OAI-PMH endpoint, supporting standards-based metadata harvesting of Macquarie
    research outputs by external aggregators.
  humanURL: https://docs.figshare.com/
  baseURL: https://api.figshare.com/v2/oai
  tags:
