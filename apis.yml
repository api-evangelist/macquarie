x-attribution-correction:
  applied: '2026-08-30'
  by: pipeline-university.md STEP 6b, file-by-file
  removed_entries: 11
  removed_files: 47
  what: >-
    Eleven apis[] entries and forty-seven artifact files, all derived from ONE saved copy of the
    generic Figshare API v2 contract (info.title "Figshare API (Macquarie University Research Data
    Repository)", info.contact "Figshare Support", servers https://api.figshare.com/v2). The June
    2026 profile saved that vendor spec under Macquarie's slug, refine-openapis split it into ten
    per-tag documents, and eleven apis[] entries plus schemas, structures, examples, rules,
    vocabulary, a JSON-LD context, scopes, an authentication profile, an agentic-access card,
    capability edges and twenty-one collection documents were derived from it. Every one inherited Figshare's
    provenance. api.figshare.com is claimed by fourteen other institutions in this catalog.
  audit-divergence: >-
    audit-university-contracts.py reaches its verdict from the HOSTNAME, so it now reads all four
    tenant surfaces here as `institution` — figshare.mq.edu.au, coursehandbook.mq.edu.au,
    multisearch.mq.edu.au and research-management.mq.edu.au are all mq.edu.au subdomains. The
    x-operator values in this file are the more precise call, reached from what each surface says
    about itself (CourseLoop siteId mq-prod-pres on api-ap-southeast-2.prod.courseloop.com;
    Elsevier's "Pure API" contract with pure-support@elsevier.com; Figshare for Institutions;
    Ex Libris Primo). Do not let a later host-based pass overwrite them.
  shared-contract-false-positive: >-
    The audit flags openapi/macquarie-research-portal-oai-pmh-openapi.yml as a shared contract
    because Maastricht ships a spec whose normalized title matches ("<Institution> Research Portal
    OAI-PMH"). It is not shared. Both were independently derived from each institution's own live
    endpoint on the same day, and the documents differ in host, admin contact, metadata formats,
    set hierarchy and record count. This is the same class of false positive the contract already
    records for Washington's uw.edu contact domain.
  note: >-
    The tenant relationship was NOT deleted — figshare.mq.edu.au is Macquarie's repository, holding
    Macquarie's data under Macquarie's DOI prefix, and survives as macquarie:rdr-figshare with
    x-operator tenant. Only the contract and its derivatives went.
