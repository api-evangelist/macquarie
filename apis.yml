- aid: macquarie:idp-shibboleth
  name: Macquarie University Identity Provider (Shibboleth / SAML 2.0)
  x-operator: institution
  description: >-
    Macquarie operates its own Shibboleth identity provider at idp.mq.edu.au, publishing SAML 2.0
    metadata anonymously at /idp/shibboleth and registered in the Australian Access Federation as
    entityID urn:mace:federation.org.au:testfed:mq.edu.au since 2018-08-24. The entity asserts
