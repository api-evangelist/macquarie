aid: macquarie
name: Macquarie University
x-type: university
x-category: Public Research University
description: >-
  Macquarie University is a public research university in Sydney, Australia. Its programmable
  footprint is small, real, and almost entirely indirect: it operates no developer portal, no
  open-data platform, and no central API programme. The one institution-operated, keyless,
  machine-readable API surface found is the Macquarie University Research Portal OAI-PMH endpoint
  at research-management.mq.edu.au, which serves 114,062 publication records and a person registry
  over OAI-PMH 2.0 with five metadata formats and no authentication. Beyond it, Macquarie operates
  a Shibboleth SAML identity provider registered in the Australian Access Federation, a self-hosted
  Moodle (iLearn) whose web services are credential-gated, and a public library GitHub organisation
  whose code consumes Ex Libris Alma rather than exposing anything. Everything else that looks like
  a Macquarie API is a vendor's contract running under Macquarie's name — Figshare for the research
  data repository, Elsevier Pure for the research portal, CourseLoop for the course handbook, Ex
  Libris Primo for library discovery. Those relationships are recorded here as tenant surfaces; the
  vendors' contracts are not.
