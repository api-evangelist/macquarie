  name: Macquarie University Research Data Repository (Figshare)
  x-operator: tenant
  description: >-
    The Macquarie University Research Data Repository is Figshare for Institutions, tenanted at
    figshare.mq.edu.au with DOI prefix 10.25949 minted through DataCite as ARDCX.MQU. The data,
