  name: Macquarie University iLearn (Moodle) Web Services
  x-operator: institution
  description: >-
    Macquarie self-hosts its learning management system as iLearn at ilearn.mq.edu.au and the
    Moodle web services REST endpoint answers publicly with a structured invalidtoken error, so the
