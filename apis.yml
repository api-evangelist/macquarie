  detail: >-
    One institution-operated, keyless, machine-readable API surface was found, verified and
    catalogued — the Macquarie University Research Portal OAI-PMH endpoint at
    research-management.mq.edu.au, with 114,062 publication records, five metadata formats and all
    six OAI-PMH verbs executing anonymously. Coverage is otherwise thin because it genuinely is:
    Macquarie operates no developer portal, no open-data platform and no course/timetable API of
    its own; api.mq.edu.au, developer.mq.edu.au, data.mq.edu.au, timetable.mq.edu.au and
    status.mq.edu.au do not resolve. Four surface classes that look institutional are vendor
    contracts on tenant hosts (Elsevier Pure, Figshare, CourseLoop, Ex Libris Primo) and are
    recorded as tenant relationships without their contracts. www.mq.edu.au is bot-blocked (403 to
    every request including robots.txt and llms.txt) and figshare.mq.edu.au is behind an AWS WAF
    challenge, so neither could be read directly; both are LIVE, not dead.
