name: Macquarie University
description: Macquarie University programmable-footprint review for APIs.json cataloging, run under the API Evangelist
  university pipeline (operator attribution before artifact volume).
url: https://raw.githubusercontent.com/api-evangelist/macquarie/refs/heads/main/review.yml
created: '2026-06-03'
modified: '2026-08-30'
reviews:
- date: '2026-06-03'
  rating: 2
  summary: 'Macquarie University (QS World 2025 #133) has no dedicated, publicly documented developer portal or
    open-data API platform. The strongest verified, live API surface is the Research Data Repository, which runs
    on Figshare for Institutions: the public Figshare REST API v2 returns Macquarie content (DOI prefix 10.25949,
    group id 39392) and the Figshare OAI-PMH endpoint responds to verb=Identify. The Library maintains real public
    open-source Alma tooling on GitHub. A Shibboleth/SAML IdP backs institutional SSO. The official macquarie-university
    GitHub org exists but has zero public repos. No Macquarie-branded endpoints were fabricated; Macquarie Bank
    (a separate financial institution with its own developer portal) was deliberately excluded.'
  endpoints:
  - url: https://www.mq.edu.au/
    status: 403
    note: Official website; returns 403 to bare curl (bot filtering) but resolves in browser.
  - url: https://figshare.mq.edu.au/
    status: 202
    note: Research Data Repository public discovery portal (Figshare for Institutions).
  - url: https://api.figshare.com/v2/articles/search
    status: 200
    note: Public Figshare API v2; POST search returns Macquarie RDR articles (DOI 10.25949).
  - url: https://api.figshare.com/v2/oai?verb=Identify
    status: 200
    note: Figshare OAI-PMH metadata harvesting endpoint, live.
  - url: https://www.researchonline.mq.edu.au/
    status: 202
    note: ResearchOnline / RDR alias resolving to the Figshare-backed repository.
  - url: https://libguides.mq.edu.au/research_data_repository
    status: 200
    note: Library guide documenting the Research Data Repository.
  - url: https://github.com/macquarie-university
    status: 200
    note: Official Macquarie University GitHub org; exists but no public repositories.
  - url: https://github.com/mqlibrary
    status: 200
    note: Macquarie University Library GitHub org with public Alma-related open-source tools.
  - url: https://idp.mq.edu.au/idp/shibboleth
    status: 200
    note: Shibboleth/SAML identity provider for institutional SSO.
  - url: https://coursehandbook.mq.edu.au/
    status: 200
    note: Course Handbook web app; no public API documentation found.
  - url: https://developer.mq.edu.au/
    status: 0
    note: No dedicated developer portal; host does not resolve.
  - url: https://data.mq.edu.au/
    status: 0
    note: No open-data platform; host does not resolve.
  - url: https://status.mq.edu.au/
    status: 0
    note: No public status page at this host.
- date: '2026-08-30'
  rating: 3
  summary: 'Re-profiled under pipeline-university.md. The 2026-06-03 review credited Macquarie with the public Figshare
    REST API v2 and the Figshare OAI-PMH endpoint; both are api.figshare.com, Figshare''s generic contract shared
    with fourteen other institutions in this catalog, and the saved spec named Figshare Support as its contact.
    Eleven apis[] entries and forty-seven derived artifact files were removed. In their place, one genuinely institution-operated,
    keyless, machine-readable surface was found and verified: the Macquarie University Research Portal OAI-PMH endpoint
    at research-management.mq.edu.au, on Macquarie''s own domain, self-identifying as ''Macquarie University Research
    Portal'' with adminEmail rms.support@mq.edu.au, serving 114,062 publication records across five metadata formats
    with no credential. The Elsevier Pure product API on the same host (/ws/api, info.title ''Pure API'', contact
    pure-support@elsevier.com, 568 paths, relative servers /ws/api) is Elsevier''s and was recorded as a tenant
    relationship without its contract. Macquarie also operates a Shibboleth IdP registered in the AAF with SIRTFI
    and REFEDS R&S, a self-hosted Moodle whose web services are credential-gated, and a real Library GitHub org.
    Four domain standards confirmed with fetched evidence: oai-pmh, shibboleth, saml, datacite. The macquarie-university
    GitHub org was dropped as a pointer: zero public repos, no name and no description, so institutional ownership
    could not be confirmed.'
  endpoints:
  - url: https://research-management.mq.edu.au/ws/oai?verb=Identify
    status: 200
    note: INSTITUTION-OPERATED. repositoryName 'Macquarie University Research Portal', adminEmail rms.support@mq.edu.au,
      protocolVersion 2.0, earliestDatestamp 2017-01-17.
  - url: https://research-management.mq.edu.au/ws/oai?verb=ListMetadataFormats
    status: 200
    note: oai_dc, mods, xmetadiss, nl_didl, qdc.
  - url: https://research-management.mq.edu.au/ws/oai?verb=ListIdentifiers&metadataPrefix=oai_dc&set=publications:all
    status: 200
    note: completeListSize 114062, 100 headers per page, resumptionToken paging.
  - url: https://research-management.mq.edu.au/ws/api/openapi.json
    status: 200
    note: VENDOR CONTRACT on a tenant host. info.title 'Pure API', contact pure-support@elsevier.com, version 5.33.3-3,
      568 paths, servers url '/ws/api' (relative, so a host-based ownership check is blind to it). Not saved.
  - url: https://idp.mq.edu.au/idp/shibboleth
    status: 200
    note: INSTITUTION-OPERATED. Shibboleth IdP SAML 2.0 metadata, shibmd:Scope mq.edu.au.
  - url: https://md.aaf.edu.au/aaf-metadata.xml
    status: 200
    note: Australian Access Federation aggregate carries the Macquarie IdP plus three Macquarie SAML SPs (iLearn
      prod, iLearn stage, LimeSurvey).
  - url: https://api.datacite.org/prefixes/10.25949
    status: 200
    note: Prefix maps to DataCite provider mqu (Macquarie University) and active repository client ARDCX.MQU.
  - url: https://ilearn.mq.edu.au/webservice/rest/server.php
    status: 200
    note: INSTITUTION-OPERATED, credential-gated. Structured Moodle 'invalidtoken' error. No public LTI endpoint
      (enrol/lti/token.php, mod/lti/certs, .well-known/openid-configuration all 404).
  - url: https://coursehandbook.mq.edu.au/
    status: 200
    note: TENANT on CourseLoop, siteId mq-prod-pres, vendor API api-ap-southeast-2.prod.courseloop.com. Shared codebase
      still carries UNSW-specific CSS classes.
  - url: https://api-ap-southeast-2.prod.courseloop.com/publisher/search-all?siteId=mq-prod-pres
    status: 403
    note: Vendor API rejects anonymous calls. No keyless surface, no contract saved.
  - url: https://multisearch.mq.edu.au/
    status: 200
    note: TENANT. Ex Libris Primo library discovery.
  - url: https://researchers.mq.edu.au/
    status: 200
    note: TENANT. Elsevier Pure public research portal.
  - url: https://figshare.mq.edu.au/
    status: 202
    note: 'TENANT, LIVE but unreadable: AWS WAF challenge (x-amzn-waf-action: challenge), zero-byte body.'
  - url: https://www.researchonline.mq.edu.au/
    status: 202
    note: Same AWS WAF challenge; alias of the Figshare-backed repository.
  - url: https://api.figshare.com/v2/oai?verb=Identify
    status: 200
    note: VENDOR. repositoryName 'figshare', adminEmail info@figshare.com. The 2026-06-03 review recorded this as
      Macquarie's OAI-PMH surface; it is Figshare's, shared by every customer. Removed.
  - url: https://policies.mq.edu.au/document/view.php?id=394
    status: 200
    note: Responsible and Ethical Use of Artificial Intelligence Policy. Recorded as AIPolicy.
  - url: https://github.com/mqlibrary
    status: 200
    note: Macquarie University Library org, 6 public repos, blog points at mq.edu.au. Institution-authored; consumes
      Alma, exposes nothing.
  - url: https://github.com/macquarie-university
    status: 200
    note: Zero public repos, no name, no description. Institutional ownership unconfirmable; dropped as a pointer
      rather than left as an unverifiable claim.
  - url: https://www.mq.edu.au/
    status: 403
    note: Bot-filtered on every path including robots.txt and llms.txt. LIVE, not dead.
  - url: https://api.mq.edu.au/
    status: 0
    note: Does not resolve.
  - url: https://developer.mq.edu.au/
    status: 0
    note: Does not resolve. No developer portal.
  - url: https://data.mq.edu.au/
    status: 0
    note: Does not resolve. No open-data platform.
  - url: https://timetable.mq.edu.au/
    status: 0
    note: Does not resolve. No institution-operated timetable API.
  - url: https://status.mq.edu.au/
    status: 0
    note: Does not resolve. No public status page.
