description: >-
  Macquarie University is a non-commercial higher-education institution and sells no API. Its one
  institution-operated public surface, the Research Portal OAI-PMH endpoint, is free, keyless and
  needs no registration; its Identify rights manifest permits metadata harvesting for discovery
  and forbids harvesting full-text documents or reproduction for commercial purposes. Everything
  else is either credential-gated behind institutional SSO (iLearn Moodle web services) or is a
  vendor's commercial product tenanted under Macquarie's name, where the pricing is the vendor's
  and not Macquarie's to publish (Elsevier Pure, Figshare, CourseLoop, Ex Libris).
notes: >-
  No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
